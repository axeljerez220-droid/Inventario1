<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario del Laboratorio · Gestión</title>
    <link rel="stylesheet" href="estilos.css" />
    <!-- Enlace a Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1><i class="fas fa-flask"></i> Inventario · Laboratorio</h1>
        <div class="badge-lab">
            <i class="fas fa-user-graduate"></i> 
            <span>Escuela Técnica · Control 2026</span>
        </div>
    </div>

    <!-- FORMULARIO DE LOGIN -->
    <div class="login-section">
        <div class="login-card">
            <h2><i class="fas fa-key"></i> Iniciar sesión</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="usuario"><i class="fas fa-user icon-label"></i> Usuario</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" value="técnico.lab" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock icon-label"></i> Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" value="lab2026" />
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked /> Recordarme
                    </label>
                    <a href="olvidar-contrasena.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                <!-- BOTÓN DE INICIO DE SESIÓN -->
                <button type="submit" class="btn-login-form">
                    <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                </button>
                <div class="login-footer-text">
                    ¿No tienes cuenta? <a href="crear-cuenta.html">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER / DATOS DEL PROYECTO -->
    <div class="footer-note">
        <span><i class="fas fa-code"></i> Desarrollado por: Lionel G. · Axel J. · Víctor C.  |  Técnicos en Programación</span>
        <span><i class="fas fa-database"></i> MySQL · PHP · HTML5/CSS  |  <i class="fas fa-clock"></i> 7 meses</span>
        <span><i class="fas fa-school"></i> Proyecto integrador · 2026</span>
    </div>

</div> <!-- fin container -->
</body>
</html>
